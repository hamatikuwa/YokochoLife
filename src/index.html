<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ツトムの挑戦状〜地獄谷商店街の夕日〜</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="titleScreen">
  <div class="titleCard">
    <h1>ツトムの挑戦状</h1>
    <p class="sub">〜地獄谷商店街の夕日〜</p>
    <div class="titleDesc">
      裏路地のスナックとぼったくりバーを切り盛りしながら、<br>
      よいよい爺の相手をしたり、チンピラと角材で殴り合ったり、<br>
      我慢できずに野グソしたりする、脱力系フリーワールドです。
    </div>
    <button id="startBtn">タップしてはじめる</button>
    <div class="titleHint">スマホを横向きにするとより遊びやすいです</div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="statRow">
    <div class="stat money">💰<span id="moneyVal">0</span>円</div>
    <div class="stat pee">
      <span class="peeIcon">🚽</span>
      <div class="gaugeBack"><div id="peeGauge" class="gaugeFill peeFill"></div></div>
    </div>
    <div class="stat energy">
      <span class="energyIcon">⚡</span>
      <div class="gaugeBack"><div id="energyGauge" class="gaugeFill energyFill"></div></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="promptBox" class="promptBox hidden"></div>
</div>

<!-- touch controls -->
<div id="touchLayer" class="hidden">
  <div id="faceCam" class="faceCam">
    <span class="faceCamRec">● REC</span>
  </div>
  <div id="dpad" class="dpad">
    <button id="dpadUp" class="dpadBtn dpadUp">▲</button>
    <button id="dpadLeft" class="dpadBtn dpadLeft">◀</button>
    <button id="dpadRight" class="dpadBtn dpadRight">▶</button>
    <button id="dpadDown" class="dpadBtn dpadDown">▼</button>
  </div>
  <div id="lookPad"></div>
  <button id="actionBtn" class="roundBtn actionBtn">話す</button>
  <button id="jumpBtn" class="roundBtn jumpBtn">跳</button>
</div>

<!-- karaoke minigame -->
<div id="karaokeUI" class="minigame hidden">
  <div class="mgPanel">
    <h2>🎤 からおけスナック「まり子」</h2>
    <p id="karaokeLine" class="mgLine">じいさん「おーい、ねーちゃん、一曲入れてくれや〜」</p>
    <div class="rhythmBar">
      <div class="rhythmZone" id="rhythmZone"></div>
      <div class="rhythmMarker" id="rhythmMarker"></div>
    </div>
    <button id="rhythmBtn" class="mgBigBtn">合いの手を入れる！</button>
    <div class="mgFooter">
      <span id="karaokeRound">1 / 3 曲目</span>
      <span id="karaokeScore">満足度: 0</span>
    </div>
  </div>
</div>

<!-- bar negotiation minigame -->
<div id="barUI" class="minigame hidden">
  <div class="mgPanel">
    <h2>🍾 ぼったくりBAR「魔界」</h2>
    <p id="barLine" class="mgLine">チンピラ「姉ちゃん、飲み放題いくらや」</p>
    <div class="mgChoices">
      <button class="mgChoiceBtn" data-greed="1">正直に会計する</button>
      <button class="mgChoiceBtn" data-greed="2">少しふっかける</button>
      <button class="mgChoiceBtn" data-greed="3">ガッツリぼったくる</button>
    </div>
  </div>
</div>

<!-- result popup -->
<div id="resultUI" class="minigame hidden">
  <div class="mgPanel small">
    <p id="resultText" class="mgLine"></p>
    <button id="resultCloseBtn" class="mgBigBtn">閉じる</button>
  </div>
</div>

<div id="fadeOverlay"></div>

<script src="lib/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
